name: Benchmark Regression Detection

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'  # Daily at 3 AM UTC

env:
  NODE_VERSION: '22'
  BENCHMARK_THRESHOLD: 5  # 5% regression threshold

jobs:
  benchmark:
    name: Benchmark Regression Detection
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build:cached

      - name: Restore benchmark database
        uses: actions/cache@v4
        with:
          path: ~/.rea-africa-enhanced/benchmarks.db
          key: benchmark-db-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            benchmark-db-${{ runner.os }}-

      - name: Run benchmark suite
        id: benchmark
        run: |
          npm run benchmark -- --ci --threshold ${{ env.BENCHMARK_THRESHOLD }} --json > benchmark-results.json
          echo "results<<EOF" >> $GITHUB_OUTPUT
          cat benchmark-results.json >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Check for regressions
        run: |
          node -e "
            const results = JSON.parse(require('fs').readFileSync('benchmark-results.json', 'utf8'));
            const regressions = results.filter(r => r.isRegression);
            if (regressions.length > 0) {
              console.log('::error::Found ${regressions.length} benchmark regressions:');
              regressions.forEach(r => {
                console.log('::error file=benchmark::${r.suite}.${r.testName}: ${r.changePercent.toFixed(2)}% regression (${r.currentValue.toFixed(2)} vs ${r.baselineValue.toFixed(2)} baseline)');
              });
              process.exit(1);
            } else {
              console.log('No regressions detected');
            }
          "

      - name: Save benchmark database
        uses: actions/cache@v4
        with:
          path: ~/.rea-africa-enhanced/benchmarks.db
          key: benchmark-db-${{ runner.os }}-${{ github.sha }}

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            benchmark-results.json
            ~/.rea-africa-enhanced/benchmarks.db
          retention-days: 30

      - name: Comment on PR with benchmark results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const results = JSON.parse(fs.readFileSync('benchmark-results.json', 'utf8'));
            
            let body = '## Benchmark Results\n\n';
            body += '| Suite | Test | Duration (ms) | Memory (MB) | CPU (%) | Status |\n';
            body += '|-------|------|---------------|-------------|---------|--------|\n';
            
            for (const r of results) {
              const status = r.isRegression ? '🔴 REGRESSION' : '✅ OK';
              body += `\`${r.suite}\` | \`${r.testName}\` | ${r.durationMs.toFixed(2)} | ${r.memoryMb.toFixed(2)} | ${r.cpuPercent.toFixed(2)} | ${status}\n`;
            }
            
            const regressions = results.filter(r => r.isRegression);
            if (regressions.length > 0) {
              body += '\n⚠️ **Found ' + regressions.length + ' regression(s)!**\n';
            }
            
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });